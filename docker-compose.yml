services:
  primary:
    build: ./primary
    container_name: primary-region
    restart: unless-stopped
  secondary:
    build: ./secondary
    container_name: secondary-region
    restart: unless-stopped
  gateway:
    image: nginx:alpine
    container_name: multi-region-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - primary
      - secondary
    restart: unless-stopped
